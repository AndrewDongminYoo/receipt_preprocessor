Managed-runtime reachability remains unverified; this exception accepts the compatibility-blocked risk rather than asserting non-reachability.
Approved on 2026-10-29 for the currently locked opentelemetry-api@1.41.1.
Review on every ADK dependency update.
Remove this entry when an official ADK release allows opentelemetry-api>=1.45.1 with a compatible SDK, and update uv.lock and requirements.txt together.
"""
