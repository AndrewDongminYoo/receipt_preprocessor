<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs><marker id="arrowhead-subagent" markerHeight="6" markerWidth="8" orient="auto" refX="8" refY="3"><path d="m0 0 8 3-8 3z" style="fill:#37474f"/></marker><style>.sub-agent-box{fill:#e3f2fd;stroke:#42a5f5;stroke-width:1.5;rx:8}.subtitle,.text{font-family:&quot;Helvetica&quot;,&quot;Arial&quot;,sans-serif}.subtitle{font-size:22px;font-weight:700;text-anchor:middle}.text{font-size:19px}.tool-list{font-family:&quot;Menlo&quot;,&quot;monospace&quot;;font-size:16px}.arrow{stroke:#37474f;stroke-width:1.5;fill:none}</style></defs><g id="receipt_preprocessor"><path d="M550 20h300v100H550z" style="fill:#f5f5f5;stroke:#616161;stroke-width:2;rx:10"/><text x="700" y="55" style="font-family:&quot;Helvetica&quot;,&quot;Arial&quot;,sans-serif;font-size:24px;font-weight:700;text-anchor:middle">receipt_preprocessor</text><text x="700" y="80" class="text" text-anchor="middle">(Main Agent)</text></g><g id="image_generation_scoring_agent"><path d="M200 240h350v100H200z" class="sub-agent-box"/><text x="375" y="295" class="subtitle">image_generation_scoring_agent</text></g><g id="checker_agent_instance"><path d="M850 240h350v150H850z" class="sub-agent-box"/><text x="1025" y="275" class="subtitle">checker_agent_instance</text><text x="860" y="305" class="text">Purpose: Checks termination condition.</text><text x="860" y="330" class="text tool-list">Tool: check_tool_condition</text></g><g id="image_generation_prompt_agent"><path d="M10 530h380v150H10z" class="sub-agent-box"/><text x="200" y="565" class="subtitle">image_generation_prompt_agent</text><text x="20" y="595" class="text">Purpose: Creates image generation prompt.</text><text x="20" y="620" class="text tool-list">Tool: get_policy</text></g><g id="image_generation_agent"><path d="M470 530h380v150H470z" class="sub-agent-box"/><text x="660" y="565" class="subtitle">image_generation_agent</text><text x="480" y="595" class="text">Purpose: Generates image using Imagen 3.</text><text x="480" y="620" class="text tool-list">Tool: generate_images</text></g><g id="scoring_images_prompt"><path d="M930 530h380v180H930z" class="sub-agent-box"/><text x="1120" y="565" class="subtitle">scoring_images_prompt</text><text x="940" y="595" class="text">Purpose: Evaluates and scores the image.</text><text x="940" y="620" class="text tool-list">Tools:</text><text x="950" y="640" class="tool-list">- get_policy</text><text x="950" y="660" class="tool-list">- get_image</text><text x="950" y="680" class="tool-list">- set_score</text></g><path marker-end="url(#arrowhead-subagent)" d="M700 120v60H375v60" class="arrow"/><path marker-end="url(#arrowhead-subagent)" d="M700 120v60h325v60" class="arrow"/><path marker-end="url(#arrowhead-subagent)" d="M375 340v90H200v100" class="arrow"/><path marker-end="url(#arrowhead-subagent)" d="M375 340v90h285v100" class="arrow"/><path marker-end="url(#arrowhead-subagent)" d="M375 340v90h745v100" class="arrow"/></svg>